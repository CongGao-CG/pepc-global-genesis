[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pepc-global-genesis"
version = "1.2.3"
authors = [
    { name = "Princeton Environment-dependent Probabilistic Tropical Cyclone model (PepC) Global version (PepC-Global)" }
]
description = "Global tropical cyclone genesis prediction using trained SVC models"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
    "joblib>=1.1",
    "xarray>=2022.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[project.urls]
Homepage = "https://github.com/CongGao-CG/pepc-global-genesis"
Repository = "https://github.com/CongGao-CG/pepc-global-genesis.git"

[tool.setuptools.packages.find]
include = ["pepc_global_genesis*"]

[tool.setuptools.package-data]
pepc_global_genesis = ["data/*.joblib", "data/*.npy", "data/*.nc"]
